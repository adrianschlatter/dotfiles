nerdfont: true
worktree_dir: .worktrees
merge_strategy: rebase
agent: crush
agents:
  crush:
    command: pi
    type: pi
sandbox:
  enabled: true
  env_passthrough:
    - OPENAI_API_KEY
  image: worktainer:0.1.2
  extra_mounts:
    - host_path: ~/stow/dotfiles/.config/agents/skills
      guest_path:  /tmp/.pi/agent/skills
panes:
  - command: <agent>
    focus: true
  - split: horizontal
    command: "vi"
  - split: vertical
