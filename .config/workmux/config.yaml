nerdfont: true
worktree_dir: .worktrees
merge_strategy: rebase
agent: crush
agents:
  crush:
    command: pi
    type: pi
sandbox:
  enabled: true
  env_passthrough:
    - OPENAI_API_KEY
  image: worktainer:0.1.2
panes:
  - command: <agent>
    focus: true
  - split: horizontal
    command: "vi"
  - split: vertical
